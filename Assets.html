<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Select</title>
<!--
  ============================================================
  BEST SELECT — Präsentationsanimation
  Steuerung: Klick (weiter) · ← zurück · Leertaste/→ weiter
  Letzter Klick startet neu.

  LOGOS EINSETZEN: im <script> unten, Objekt LOGOS.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#09192C; --ink-deep:#050E19;
    --blue:#2378E7; --lift:#5FA3F5; --cream:#F7EFE9;
    --muted:rgba(245,250,255,.68); --hair:rgba(215,226,255,.14);
    --glass-hi:rgba(245,250,255,.16); --glass-lo:rgba(245,250,255,.07);
    --halo:rgba(215,226,255,.35);
    --ease:cubic-bezier(.76,0,.1,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--ink-deep);color:var(--cream);cursor:pointer;
    font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  #viewport{position:fixed;inset:0;
    background:radial-gradient(115% 95% at 66% 26%, #0D2239 0%, var(--ink) 48%, var(--ink-deep) 100%)}
  #stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;
    background:url('Background.png') center/cover no-repeat}
  /* Scrims: top legibility gradient + Lichtabfall hinter dem Wand-Logo (Karten lesbar) + Vignette */
  #stage::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(46% 16% at 50% 35%,rgba(5,14,25,.34),transparent 72%),
      linear-gradient(180deg,rgba(5,14,25,.78) 0%,rgba(5,14,25,.45) 18%,rgba(5,14,25,0) 34%)}
  #stage::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(115% 95% at 50% 40%,rgba(5,14,25,.14) 0%,rgba(5,14,25,.24) 55%,rgba(5,14,25,.55) 100%)}

  /* ---------- Textschiene oben mittig ---------- */
  .rail{position:absolute;left:50%;margin-left:-360px;top:52px;width:720px;text-align:center;z-index:3}
  .rule{width:56px;height:1px;background:var(--blue);margin:0 auto 20px}
  .kicker{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--lift)}
  .rail h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:42px;line-height:1.08;
    letter-spacing:-.01em;margin:14px 0 12px}
  .sub{font-size:15.5px;line-height:1.55;color:var(--muted)}
  .rail .note{font-size:12px;line-height:1.5;letter-spacing:.02em;color:rgba(245,250,255,.48);margin-top:14px}
  .meta{position:absolute;bottom:24px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);z-index:3}
  #hint{left:96px}
  #count{right:96px;font-variant-numeric:tabular-nums}

  /* ---------- Spalten-Spines ---------- */
  .spine{position:absolute;top:186px;width:1px;height:300px;background:var(--hair);opacity:0;z-index:0}

  /* ---------- Karten: helles Glas (Design.md Glass Rule) ---------- */
  .card{position:absolute;left:50%;top:50%;opacity:0;border-radius:8px;z-index:1;
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    outline:1px solid rgba(197,198,205,.15);
    box-shadow:0 12px 32px rgba(9,25,44,.45);
    transition:background .55s ease,box-shadow .55s ease}
  .co{width:168px;height:104px;margin:-52px 0 0 -84px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .wn{width:260px;height:72px;margin:-36px 0 0 -130px;padding:0 20px;
    display:flex;align-items:center;gap:16px}
  .pr{width:260px;height:64px;margin:-32px 0 0 -130px;padding:0 18px;
    display:flex;align-items:center;justify-content:space-between}

  .logo{width:44px;height:44px;border-radius:8px;background:rgba(245,250,255,.12);
    display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
  .wn .logo{width:36px;height:36px;border-radius:8px;background:rgba(35,120,231,.3)}
  .logo svg,.logo img{width:74%;height:74%;display:block;object-fit:contain}
  .mono{font-size:14px;font-weight:500;letter-spacing:.06em;color:rgba(215,226,255,.85)}
  .wn .mono{font-family:'DM Serif Display',Georgia,serif;font-size:17px;letter-spacing:0;color:#fff}
  .cname{font-size:14px;font-weight:500;letter-spacing:.03em;color:rgba(255,255,255,.95)}
  .wname{font-size:15px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.95)}
  .pname{font-size:15px;font-weight:500;letter-spacing:.01em;color:rgba(255,255,255,.95)}

  /* ---------- Rating: Batterie ---------- */
  .tier{display:flex;gap:6px;flex:0 0 auto}
  .tier i{width:26px;height:5px;border-radius:3px;background:rgba(245,250,255,.18);
    overflow:hidden;display:block}
  .tier i b{display:block;width:100%;height:100%;border-radius:3px;background:var(--lift);
    transform:scaleX(0);transform-origin:left center;
    transition:transform .9s var(--ease);transition-delay:0ms}
  .card.charged .tier i.on b{transform:scaleX(1);
    transition-delay:calc(var(--s) * 320ms)}

  .card.glow{background:linear-gradient(180deg,rgba(35,120,231,.38),rgba(35,120,231,.14));
    box-shadow:0 0 0 2px var(--halo),0 0 70px -12px rgba(35,120,231,.85),0 24px 48px -28px rgba(3,9,17,.8)}
  .card.head{background:linear-gradient(180deg,rgba(245,250,255,.22),rgba(245,250,255,.1));
    box-shadow:0 12px 32px rgba(9,25,44,.4)}

  /* ---------- Funnel: dimensionales Glas (deckend, im Vordergrund) ---------- */
  #funnel{position:absolute;inset:0;width:1600px;height:900px;opacity:0;z-index:2;
    overflow:visible;transform-origin:50% 66%}
  #funnel .lip{stroke:var(--blue);stroke-width:2.5}
  #funnel .sep{stroke:rgba(215,226,255,.14);stroke-width:1;transition:stroke 1.0s ease}
  #funnel.active .sep{stroke:rgba(215,226,255,.3);transition-delay:calc(var(--i) * 1.3s)}
  #funnel .edge{stroke-width:1.5;fill:none}
  /* Kriterien: Ladebalken-Sequenz — Wort + Zeilenband leuchten im Sekundentakt auf */
  #funnel .crit{font-family:Inter,sans-serif;font-size:13px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;fill:rgba(215,226,255,.55);text-anchor:middle;
    transition:fill 1.0s ease,opacity 1.1s ease}
  #funnel.recede .crit{opacity:0}
  #funnel.active .crit{fill:rgba(255,255,255,.95);transition-delay:calc(var(--i) * 1.3s)}
  #funnel .rowband{fill:rgba(95,163,245,0);transition:fill 1.1s ease}
  #funnel .rowband.alt{fill:rgba(215,226,255,.04)}
  #funnel.active .rowband{fill:rgba(95,163,245,.13);transition-delay:calc(var(--i) * 1.3s)}

  /* ---------- Finale (Schritt 07): Empfehlung im Zentrum ---------- */
  #finale{position:absolute;left:50%;top:560px;width:1000px;margin-left:-500px;text-align:center;
    opacity:0;z-index:3;pointer-events:none}
  #finale .tag{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--lift)}
  #finale .fname{font-family:'DM Serif Display',Georgia,serif;font-size:40px;line-height:1.1;
    color:#fff;margin:12px 0 30px}
  .fcrit{display:inline-flex;align-items:center;gap:9px;margin:0 14px;opacity:0;
    font-size:12.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(215,226,255,.85)}
  .fcrit svg{width:15px;height:15px;flex:0 0 auto}
  .fcrit svg path{stroke:var(--lift);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* Nur für Screenreader: Evidenz je Schritt */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @media (forced-colors: active){
    .card{outline:1px solid CanvasText}
    .tier i{outline:1px solid CanvasText}
    .tier i b{background:Highlight;forced-color-adjust:none}
  }

  @media (prefers-reduced-motion: reduce){
    .card,.crit,.rowband,.sep,.tier i b{transition-duration:.01ms !important;transition-delay:0ms !important}
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">

    <div class="spine" style="left:500px"></div>
    <div class="spine" style="left:800px"></div>
    <div class="spine" style="left:1100px"></div>

    <div id="companies" aria-hidden="true"></div>
    <div id="winners" aria-hidden="true"></div>
    <div id="products" aria-hidden="true"></div>

    <svg id="funnel" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <linearGradient id="fg" x1="0" y1="560" x2="0" y2="758" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#15375A"/>
          <stop offset="1" stop-color="#0A1E33"/>
        </linearGradient>
        <radialGradient id="fInner" cx="800" cy="570" r="340" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="rgba(95,163,245,.24)"/>
          <stop offset="1" stop-color="rgba(95,163,245,0)"/>
        </radialGradient>
        <linearGradient id="fEdge" x1="0" y1="560" x2="0" y2="720" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="rgba(180,210,255,.42)"/>
          <stop offset="1" stop-color="rgba(180,210,255,.05)"/>
        </linearGradient>
        <linearGradient id="fBeam" x1="0" y1="758" x2="0" y2="862" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="rgba(95,163,245,.3)"/>
          <stop offset="1" stop-color="rgba(95,163,245,0)"/>
        </linearGradient>
        <filter id="fGlow" x="-60%" y="-600%" width="220%" height="1300%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g transform="translate(0,-64)">
      <!-- Lichtkegel unter dem Auslauf -->
      <rect x="768" y="758" width="64" height="104" fill="url(#fBeam)"/>

      <!-- Korpus -->
      <path d="M460 560 H1140 L830 720 V758 H770 V720 Z" fill="url(#fg)"/>
      <!-- Innenlicht -->
      <path d="M460 560 H1140 L830 720 V758 H770 V720 Z" fill="url(#fInner)"/>

      <!-- Ladebalken-Zeilenbaender (leuchten sequenziell mit den Kriterien) -->
      <path class="rowband" style="--i:0" d="M460 560 H1140 L1054.75 604 H545.25 Z"/>
      <path class="rowband alt" style="--i:1" d="M545.25 604 H1054.75 L992.75 636 H607.25 Z"/>
      <path class="rowband" style="--i:2" d="M607.25 636 H992.75 L930.75 668 H669.25 Z"/>
      <path class="rowband alt" style="--i:3" d="M669.25 668 H930.75 L872.625 698 H727.375 Z"/>
      <path class="rowband" style="--i:4" d="M727.375 698 H872.625 L830 720 V758 H770 V720 Z"/>

      <!-- Wandstaerke: dunkles Band unter dem Rand -->
      <path d="M460 560 H1140 L1124.5 568 H475.5 Z" fill="rgba(4,11,20,.6)"/>
      <line x1="475.5" y1="568" x2="1124.5" y2="568" stroke="rgba(180,210,255,.15)" stroke-width="1"/>

      <!-- Kriterien-Trennlinien (aetzen sich zeilenweise mit dem Ladebalken ein) -->
      <line class="sep" style="--i:1" x1="559" y1="604" x2="1041" y2="604"/>
      <line class="sep" style="--i:2" x1="621" y1="636" x2="979"  y2="636"/>
      <line class="sep" style="--i:3" x1="683" y1="668" x2="917"  y2="668"/>
      <line class="sep" style="--i:4" x1="741" y1="698" x2="859"  y2="698"/>

      <!-- Glaskanten -->
      <line class="edge" x1="460" y1="560" x2="770" y2="720" stroke="url(#fEdge)"/>
      <line class="edge" x1="1140" y1="560" x2="830" y2="720" stroke="url(#fEdge)"/>
      <line x1="770" y1="720" x2="770" y2="758" stroke="rgba(180,210,255,.25)" stroke-width="1.5"/>
      <line x1="830" y1="720" x2="830" y2="758" stroke="rgba(180,210,255,.25)" stroke-width="1.5"/>

      <!-- Leuchtender Rand + Auslauf -->
      <line class="lip" x1="460" y1="561" x2="1140" y2="561" filter="url(#fGlow)"/>
      <line x1="772" y1="758" x2="828" y2="758" stroke="#5FA3F5" stroke-width="2.5" filter="url(#fGlow)"/>

      <g id="crits">
        <text class="crit" style="--i:0" x="800" y="586"></text>
        <text class="crit" style="--i:1" x="800" y="624"></text>
        <text class="crit" style="--i:2" x="800" y="656"></text>
        <text class="crit" style="--i:3" x="800" y="687"></text>
        <text class="crit" style="--i:4" x="800" y="713"></text>
      </g>
      </g>
    </svg>

    <div id="finale" aria-hidden="true"><div class="tag">Best Select</div><div class="fname">Gesellschaft B · Premium</div><div id="fcrits"></div></div>

    <div class="rail" id="rail" aria-live="polite">
      <div class="rule"></div>
      <div class="kicker" id="kicker"></div>
      <h1 id="head"></h1>
      <div class="sub" id="sub"></div>
      <div class="note" id="note"></div>
      <div class="sr-only" id="sr-evidence"></div>
    </div>
    <noscript><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      font-size:16px;color:#F7EFE9;text-align:center">Diese Präsentation benötigt JavaScript.</div></noscript>

    <div class="meta" id="hint"></div>
    <div class="meta" id="count"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
(function () {

  /* ============================================================
     LOGO-SLOTS
     SVG-Markup (oder <img src="...">) der jeweiligen Gesellschaft
     hier einsetzen. Empfehlungen:
       · viewBox behalten, width/height weglassen
       · einfarbige Marken: fill="currentColor"
       · Slot ist 44x44 px, Inhalt wird auf 74% skaliert
     Leer lassen = Platzhalter-Monogramm.
     ============================================================ */
  var LOGOS = {
    'Allianz':      '',
    'ERGO':         '',
    'AXA':          '',
    'Generali':     '',
    'HDI':          '',
    'R+V':          '',
    'Debeka':       '',
    'Signal Iduna': '',
    'HUK-Coburg':   ''
  };

  var COMPANIES = [
    { n: 'Allianz',      mono: 'A' },
    { n: 'ERGO',         mono: 'E' },
    { n: 'AXA',          mono: 'AXA' },
    { n: 'Generali',     mono: 'G' },
    { n: 'HDI',          mono: 'HDI' },
    { n: 'R+V',          mono: 'R+V' },
    { n: 'Debeka',       mono: 'D' },
    { n: 'Signal Iduna', mono: 'SI' },
    { n: 'HUK-Coburg',   mono: 'HUK' }
  ];

  var WINNERS = [
    { n: 'Gesellschaft A', mono: 'A' },
    { n: 'Gesellschaft B', mono: 'B' },
    { n: 'Gesellschaft C', mono: 'C' }
  ];

  /* 3 Tarife je Gesellschaft, Spalte = col */
  /* Nur die Empfehlung erreicht 3/3 — der Maßstab muss sein eigenes Ergebnis tragen */
  var PRODUCTS = [
    { n: 'Basis',        v: 1, col: 0 },
    { n: 'Komfort',      v: 2, col: 0 },
    { n: 'Komfort Plus', v: 2, col: 0 },
    { n: 'Start',        v: 1, col: 1 },
    { n: 'Plus',         v: 2, col: 1 },
    { n: 'Premium',      v: 3, col: 1 },
    { n: 'Classic',      v: 1, col: 2 },
    { n: 'Aktiv',        v: 2, col: 2 },
    { n: 'Aktiv Plus',   v: 2, col: 2 }
  ];
  var WIN_P = 5;                      /* Gesellschaft B · Premium */
  var WIN_COL = Math.floor(WIN_P / 3);

  var CRIT_C = ['Service & Regulierung', 'Bestandsführung', 'Bilanzqualität', 'Finanzstärke', 'Beitrag'];
  var CRIT_P = ['Leistungsumfang', 'Bedingungswerk', 'Flexibilität', 'Beitrag', 'Rating'];

  /* Nur der Titel trägt eine Unterzeile — der Berater spricht, die Bühne zeigt */
  var T = [
    { k: 'Auswahlprozess',           h: 'Best Select',            s: 'Zwei Filter. Eine Empfehlung.' },
    { k: 'Schritt 01 · Markt',       h: 'Neun Gesellschaften' },
    { k: 'Schritt 02 · Filter',      h: 'Fünf Kriterien' },
    { k: 'Schritt 03 · Ergebnis',    h: 'Drei bleiben übrig',
      n: 'Darstellung anonymisiert — die Namen nennen wir im persönlichen Gespräch.' },
    { k: 'Schritt 04 · Portfolio',   h: 'Blick in die Häuser' },
    { k: 'Schritt 05 · Tarife',      h: 'Neun Tarife' },
    { k: 'Schritt 06 · Filter',      h: 'Derselbe Maßstab' },
    { k: 'Schritt 07 · Best Select', h: 'Ein Tarif bleibt' }
  ];
  var LAST = T.length - 1;

  /* ---------- Animations-Wrapper: Motion, sonst CSS-Transitions ---------- */
  var M = window.Motion && window.Motion.animate ? window.Motion.animate : null;
  var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = [0.76, 0, 0.1, 1];
  var CB = 'cubic-bezier(.76,0,.1,1)';

  function tx(el, p, o) {
    o = o || {};
    var d = REDUCE ? 0 : (o.duration === undefined ? 1.5 : o.duration);
    var dl = REDUCE ? 0 : (o.delay || 0);
    if (M) {
      var t = {};
      if (p.x !== undefined) t.x = p.x;
      if (p.y !== undefined) t.y = p.y;
      if (p.scale !== undefined) t.scale = p.scale;
      if (p.opacity !== undefined) t.opacity = p.opacity;
      M(el, t, { duration: d, delay: dl, ease: o.ease || EASE });
      return;
    }
    var parts = [];
    if (p.x !== undefined || p.y !== undefined) parts.push('translate');
    if (p.scale !== undefined) parts.push('scale');
    if (p.opacity !== undefined) parts.push('opacity');
    el.style.transition = parts.map(function (n) {
      return n + ' ' + d + 's ' + CB + ' ' + dl + 's';
    }).join(',');
    if (p.x !== undefined || p.y !== undefined) el.style.translate = (p.x || 0) + 'px ' + (p.y || 0) + 'px';
    if (p.scale !== undefined) el.style.scale = p.scale;
    if (p.opacity !== undefined) el.style.opacity = p.opacity;
  }

  /* ---------- Geometrie (Bühnenmitte = 800/450, alles zentriert) ---------- */
  var CO_COLS = [-260, 0, 260];         /* abs 540 / 800 / 1060 — deckt sich mit dem Funnel-Mund */
  var CO_ROWS = [-184, -64, 56];        /* abs 266 / 386 / 506 */
  var CANVAS_X = 0;                     /* abs 800 */
  var COLS3 = [-300, 0, 300];           /* abs 500 / 800 / 1100 */
  var PR_ROWS = [-148, -72, 4];         /* abs 302 / 378 / 454 */
  var HEAD_Y = -228;                    /* abs 222 */
  var SINK_Y = 145;                     /* abs 595 — im Inneren des Funnels an der Tischkante */
  var OUT_Y = 320;                      /* abs 770 — Ergebnisse unter dem Auslauf (Schritte 03 + 07) */
  var FUNNEL_REST = 0;                  /* Tischkanten-Position: Auslauf endet an der Tischkante (03 / 06 / 07) */
  var FUNNEL_DEEP = 102;                /* Schritt 02: Mund unter der Signal-Iduna-Reihe, Lichtkegel bis zum Bildrand */
  var FUNNEL_OFF = 420;                 /* Funnel unterhalb des Bildes geparkt */

  /* ---------- Aufbau ---------- */
  function slot(name, mono) {
    return '<div class="logo">' + (LOGOS[name] ? LOGOS[name] : '<span class="mono">' + mono + '</span>') + '</div>';
  }

  var elCo = document.getElementById('companies');
  COMPANIES.forEach(function (c, i) {
    var el = document.createElement('div');
    el.className = 'card co';
    el.innerHTML = slot(c.n, c.mono) + '<div class="cname">' + c.n + '</div>';
    elCo.appendChild(el);
    c.el = el;
    c.hx = CO_COLS[i % 3];
    c.hy = CO_ROWS[Math.floor(i / 3)];
  });

  var elWn = document.getElementById('winners');
  WINNERS.forEach(function (w, i) {
    var el = document.createElement('div');
    el.className = 'card wn';
    el.innerHTML = '<div class="logo"><span class="mono">' + w.mono + '</span></div>' +
                   '<div class="wname">' + w.n + '</div>';
    elWn.appendChild(el);
    w.el = el;
    w.hx = COLS3[i];
  });

  var elPr = document.getElementById('products');
  var rowOf = {};
  PRODUCTS.forEach(function (p) {
    rowOf[p.col] = (rowOf[p.col] === undefined) ? 0 : rowOf[p.col] + 1;
    var bars = '';
    for (var j = 0; j < 3; j++) bars += '<i class="' + (j < p.v ? 'on' : '') + '" style="--s:' + j + '"><b></b></i>';
    var el = document.createElement('div');
    el.className = 'card pr';
    el.innerHTML = '<div class="pname">' + p.n + '</div><div class="tier">' + bars + '</div>';
    elPr.appendChild(el);
    p.el = el;
    p.hx = COLS3[p.col];
    p.hy = PR_ROWS[rowOf[p.col]];
  });

  var funnel = document.getElementById('funnel');
  var crits = document.getElementById('crits').querySelectorAll('text');
  var spines = document.querySelectorAll('.spine');
  var finale = document.getElementById('finale');
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg>';
  var fcritEls = CRIT_P.map(function (c) {
    var el = document.createElement('span');
    el.className = 'fcrit';
    el.innerHTML = CHECK + c;
    document.getElementById('fcrits').appendChild(el);
    return el;
  });
  var rail = document.getElementById('rail');
  var kicker = document.getElementById('kicker');
  var head = document.getElementById('head');
  var sub = document.getElementById('sub');
  var note = document.getElementById('note');
  var srEvidence = document.getElementById('sr-evidence');

  /* Evidenz je Schritt für Screenreader — die visuellen Ebenen sind aria-hidden */
  function evidenceFor(step) {
    function names(list) { return list.map(function (x) { return x.n; }).join(', '); }
    function tarife(col) {
      return PRODUCTS.filter(function (p) { return p.col === col; })
        .map(function (p) { return p.n + ' ' + p.v + ' von 3'; }).join(', ');
    }
    if (step === 1) return 'Die neun Gesellschaften: ' + names(COMPANIES) + '.';
    if (step === 2) return 'Die fünf Kriterien: ' + CRIT_C.join(', ') + '.';
    if (step === 3) return 'Übrig bleiben: ' + names(WINNERS) + '.';
    if (step === 5) return WINNERS.map(function (w, i) { return w.n + ': ' + tarife(i); }).join('. ') + '.';
    if (step === 6) return 'Die fünf Tarif-Kriterien: ' + CRIT_P.join(', ') + '.';
    if (step === 7) return 'Die Empfehlung: Gesellschaft B, Tarif ' + PRODUCTS[WIN_P].n +
      ' — 3 von 3. Alle fünf Kriterien erfüllt: ' + CRIT_P.join(', ') + '.';
    return '';
  }
  var hint = document.getElementById('hint');
  var count = document.getElementById('count');
  var stage = document.getElementById('stage');

  /* ---------- Ablauf ---------- */
  var seq = 0;
  function later(fn, ms) {
    var my = seq;
    setTimeout(function () { if (my === seq) fn(); }, REDUCE ? 0 : ms);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function coState(step, i) {
    var c = COMPANIES[i];
    if (step === 0) return { x: c.hx, y: c.hy + 26, scale: .94, opacity: 0 };
    if (step === 1) return { x: c.hx, y: c.hy, scale: 1, opacity: 1 };
    if (step === 2) return { x: CANVAS_X, y: SINK_Y, scale: .55, opacity: 1 };
    return { x: CANVAS_X, y: SINK_Y, scale: .55, opacity: 0 };
  }

  function renderCompanies(step, inst, dir) {
    var intake = (step === 2 && dir >= 0 && !inst);
    COMPANIES.forEach(function (c, i) {
      if (intake) {
        tx(c.el, coState(1, i), { duration: 0 });
        later(function () { tx(c.el, coState(2, i), { duration: 1.7, delay: i * .1 }); }, 2200);
      } else {
        tx(c.el, coState(step, i), {
          duration: inst ? 0 : 1.6,
          delay: inst ? 0 : (step === 1 ? i * .16 : 0)
        });
      }
    });
  }

  function renderWinners(step, inst, dir) {
    WINNERS.forEach(function (w, i) {
      var t;
      if (step < 3)       t = { x: CANVAS_X, y: SINK_Y, scale: .55, opacity: 0 };
      else if (step === 3) t = { x: w.hx, y: OUT_Y, scale: 1, opacity: 1 };
      else                t = { x: w.hx, y: HEAD_Y, scale: 1, opacity: (step === 7 && i !== WIN_COL ? .45 : 1) };
      if (step === 3 && !inst && dir >= 0) {
        /* Aus dem Auslauf: am Austritt schnell sichtbar, dann gebremster Fall */
        tx(w.el, { x: CANVAS_X, y: FUNNEL_REST + 250, scale: .5, opacity: 0 }, { duration: 0 });
        tx(w.el, { opacity: 1 }, { duration: .45, delay: 2.0 + i * .35 });
        tx(w.el, { x: w.hx, y: OUT_Y, scale: 1 }, { duration: 1.6, delay: 2.0 + i * .35 });
      } else {
        tx(w.el, t, {
          duration: inst ? 0 : (step === 4 ? 1.7 : 1.6),
          delay: inst ? 0 : (step === 4 ? .5 + i * .16 : 0)
        });
      }
      w.el.classList.toggle('glow', step === 3);
      w.el.classList.toggle('head', step >= 4);
    });
  }

  function prState(step, i) {
    var p = PRODUCTS[i];
    if (step < 5)        return { x: p.hx, y: p.hy + 24, scale: .94, opacity: 0 };
    if (step === 5)      return { x: p.hx, y: p.hy, scale: 1, opacity: 1 };
    if (step === 6)      return { x: CANVAS_X, y: SINK_Y, scale: .5, opacity: 1 };
    return i === WIN_P ? { x: CANVAS_X, y: 40, scale: 1.4, opacity: 1 }
                       : { x: CANVAS_X, y: SINK_Y, scale: .5, opacity: 0 };
  }

  function renderProducts(step, inst, dir) {
    var intake = (step === 6 && dir >= 0 && !inst);
    PRODUCTS.forEach(function (p, i) {
      if (intake) {
        tx(p.el, prState(5, i), { duration: 0 });
        later(function () { tx(p.el, prState(6, i), { duration: 1.7, delay: i * .08 }); }, 2200);
      } else if (step === 7 && i === WIN_P && !inst) {
        /* Zwei Akte: Fall aus dem Auslauf, dann Aufstieg ins Zentrum */
        tx(p.el, { x: CANVAS_X, y: OUT_Y, scale: 1.15, opacity: 1 }, { duration: 1.8, delay: .6 });
        later(function () { tx(p.el, prState(7, i), { duration: 2.0 }); }, 2600);
      } else {
        tx(p.el, prState(step, i), {
          duration: inst ? 0 : 1.6,
          delay: inst ? 0 : (step === 5 ? .45 + i * .1 : 0)
        });
      }
      if (step === 7 && i === WIN_P) {
        if (inst) p.el.classList.add('glow');
        else later(function () { p.el.classList.add('glow'); }, 2600);
      } else p.el.classList.remove('glow');
      if (step >= 5) {
        if (inst) p.el.classList.add('charged');
        else if (step === 5) later(function () { p.el.classList.add('charged'); }, 850 + i * 160);
        else if (step === 7 && i === WIN_P) {
          p.el.classList.remove('charged');
          later(function () { p.el.classList.add('charged'); }, 1300);
        } else p.el.classList.add('charged');
      } else p.el.classList.remove('charged');
    });
    var showSpines = (step === 4 || step === 5);
    for (var s = 0; s < spines.length; s++) {
      tx(spines[s], { opacity: showSpines ? 1 : 0 },
         { duration: inst ? 0 : 1.1, delay: inst ? 0 : (showSpines ? .8 : 0) });
    }
  }

  function renderFunnel(step, inst, dir) {
    var set = step >= 5 ? CRIT_P : CRIT_C;
    for (var i = 0; i < crits.length; i++) crits[i].textContent = set[i];
    var lit = (step === 2 || step === 6);
    if (step === 2 || step === 6) {
      /* Die Maschine fährt von unten hoch — Mund öffnet unter der Kartenreihe */
      var restY = step === 2 ? FUNNEL_DEEP : FUNNEL_REST;
      funnel.classList.remove('recede');
      if (inst) tx(funnel, { y: restY, scale: 1, opacity: 1 }, { duration: 0 });
      else if (dir >= 0) {
        tx(funnel, { y: FUNNEL_OFF, scale: 1, opacity: 1 }, { duration: 0 });
        tx(funnel, { y: restY }, { duration: 2.0 });
      } else {
        tx(funnel, { y: restY, scale: 1, opacity: 1 }, { duration: 1.8 });
      }
    } else if (step === 3) {
      /* Rückt zur Tischkante auf — Ergebnisse treten unter dem Auslauf aus */
      funnel.classList.remove('recede');
      tx(funnel, { y: FUNNEL_REST, scale: 1, opacity: 1 }, { duration: inst ? 0 : 1.6 });
    } else if (step === 7) {
      /* Finale: Funnel sinkt zur Tischkante zurück und wird Kulisse */
      if (inst) { tx(funnel, { y: FUNNEL_REST + 60, scale: .97, opacity: .12 }, { duration: 0 }); funnel.classList.add('recede'); }
      else later(function () {
        tx(funnel, { y: FUNNEL_REST + 60, scale: .97, opacity: .12 }, { duration: 1.6 });
        funnel.classList.add('recede');
      }, 2600);
    } else {
      /* 0 · 1 · 4 · 5: unterhalb des Bildes geparkt */
      funnel.classList.remove('recede');
      if (inst) tx(funnel, { y: FUNNEL_OFF, scale: 1, opacity: 1 }, { duration: 0 });
      else if (dir < 0) tx(funnel, { y: FUNNEL_OFF, opacity: 1 }, { duration: 1.8 });
      else {
        tx(funnel, { opacity: 0 }, { duration: .7 });
        later(function () { tx(funnel, { y: FUNNEL_OFF, opacity: 1 }, { duration: 0 }); }, 800);
      }
    }
    if (lit && dir >= 0 && !inst) {
      funnel.classList.remove('active');
      /* Der Ladebalken beginnt erst, wenn die letzte Karte gelandet ist (+ Atempause):
         Aufstieg 2.0s + Einsaugen ab 2.2s (letzte Karte: Stagger + 1.7s Fall) + 0.4s */
      later(function () { funnel.classList.add('active'); }, step === 2 ? 5100 : 5000);
    } else funnel.classList.toggle('active', lit);
  }

  var lastText = -1;
  function renderText(step, inst) {
    if (lastText === step) return;
    var t = T[step];
    function apply() {
      kicker.textContent = t.k; head.textContent = t.h;
      sub.textContent = t.s || '';
      sub.style.display = t.s ? '' : 'none';
      note.textContent = t.n || '';
      note.style.display = t.n ? '' : 'none';
      srEvidence.textContent = evidenceFor(step);
      tx(rail, { y: 0, opacity: 1 }, { duration: inst ? 0 : 1.1 });
    }
    if (inst || lastText < 0) { tx(rail, { y: 0, opacity: 1 }, { duration: 0 }); apply(); }
    else {
      tx(rail, { y: -12, opacity: 0 }, { duration: .4, ease: [.4, 0, 1, 1] });
      later(function () {
        tx(rail, { y: 14, opacity: 0 }, { duration: 0 });
        requestAnimationFrame(apply);
      }, 460);
    }
    lastText = step;
  }

  function render(step, inst, dir) {
    seq++;
    renderText(step, inst);
    renderCompanies(step, inst, dir);
    renderWinners(step, inst, dir);
    renderProducts(step, inst, dir);
    renderFunnel(step, inst, dir);

    var showFinale = step === 7;
    if (inst) {
      tx(finale, { opacity: showFinale ? 1 : 0 }, { duration: 0 });
      fcritEls.forEach(function (el) {
        tx(el, { y: showFinale ? 0 : 8, opacity: showFinale ? 1 : 0 }, { duration: 0 });
      });
    } else if (showFinale) {
      later(function () {
        tx(finale, { opacity: 1 }, { duration: 1.4 });
        fcritEls.forEach(function (el, i) {
          tx(el, { y: 8, opacity: 0 }, { duration: 0 });
          tx(el, { y: 0, opacity: 1 }, { duration: 1.0, delay: 1.0 + i * .6 });
        });
      }, 3300);
    } else {
      tx(finale, { opacity: 0 }, { duration: .4 });
      fcritEls.forEach(function (el) { tx(el, { y: 8, opacity: 0 }, { duration: .3 }); });
    }

    count.textContent = pad(step) + ' / ' + pad(LAST);
    hint.textContent = step === LAST ? 'Klicken für Neustart' : 'Klicken für den nächsten Schritt';
  }

  /* ---------- Steuerung ---------- */
  var step = 0, busy = false;
  function lock(ms) {
    busy = true;
    setTimeout(function () { busy = false; }, REDUCE ? 120 : ms);
  }
  /* Sperre folgt der laufenden Choreografie — ein zweiter Klick kann
     keinen Erzählmoment mehr amputieren, überspringt aber nichts Wichtiges */
  function lockFor(n) {
    if (n === 2 || n === 6) return 2600;   /* Hochfahren + Einsaugen */
    if (n === 7) return 2900;              /* Fall + Aufstieg ins Zentrum */
    if (n === 3) return 2400;              /* Aufstieg + Ausgabe auf den Tisch */
    return 700;
  }
  function go(n) {
    if (busy) return;
    if (n > LAST) {
      lock(1300);
      seq++;
      tx(stage, { opacity: 0 }, { duration: .6 });
      setTimeout(function () {
        step = 0; lastText = -1; render(0, true, 1);
        tx(stage, { opacity: 1 }, { duration: 1.0 });
      }, 640);
      return;
    }
    var dir = n < step ? -1 : 1;
    step = Math.max(0, n);
    lock(lockFor(step));
    render(step, false, dir);
  }

  document.addEventListener('click', function () { go(step + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); go(step + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') { e.preventDefault(); go(step - 1); }
  });

  /* Browser-Zoom darf die Bühne wirklich vergrößern (Barrierefreiheit):
     Zoom hebt devicePixelRatio an — die Skalierung wächst mit und der
     Viewport wird scrollbar statt die Vergrößerung wegzurechnen. */
  var viewportEl = document.getElementById('viewport');
  var baseDpr = window.devicePixelRatio || 1;
  function fit() {
    var zoom = (window.devicePixelRatio || 1) / baseDpr;
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900) * Math.max(1, zoom);
    var over = 1600 * s > window.innerWidth + 1 || 900 * s > window.innerHeight + 1;
    document.documentElement.style.overflow = over ? 'auto' : 'hidden';
    document.body.style.overflow = over ? 'auto' : 'hidden';
    if (over) {
      viewportEl.style.position = 'absolute';
      viewportEl.style.width = Math.max(window.innerWidth, Math.ceil(1600 * s)) + 'px';
      viewportEl.style.height = Math.max(window.innerHeight, Math.ceil(900 * s)) + 'px';
    } else {
      viewportEl.style.position = 'fixed';
      viewportEl.style.width = '';
      viewportEl.style.height = '';
    }
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  render(0, true, 1);
})();
</script>
</body>
</html>
